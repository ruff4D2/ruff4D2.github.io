// Runtime state
let activeQuestions = [...originalQuestions]; // Currently displayed questions (can be filtered for retry)
let currentQuestion = 0;
let userAnswers = {};      // { questionNumber: ['a', 'c'] }
let isAnswerChecked = {};  // { questionNumber: true/false }
let wrongQuestions = [];   // Question numbers answered wrong in the current run
let quizMode = 'normal';   // 'normal' or 'retry-wrong'

function startQuiz() {
    // document.getElementById('settingsPanel').classList.add('hidden');
    activeQuestions = [...originalQuestions];
    currentQuestion = 0;
    userAnswers = {};
    isAnswerChecked = {};
    wrongQuestions = [];
    quizMode = 'normal';
    showQuizUI();
    renderQuestion();
}

function showQuizUI() {
    document.getElementById('questionContainer').classList.remove('hidden');
    document.getElementById('navigation').classList.remove('hidden');
    document.getElementById('actionButtons').classList.remove('hidden');
    document.getElementById('scoreDisplay').classList.add('hidden');
}

function hideQuizUI() {
    document.getElementById('questionContainer').classList.add('hidden');
    document.getElementById('navigation').classList.add('hidden');
    document.getElementById('actionButtons').classList.add('hidden');
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').textContent = '';
}

function renderQuestion() {
    const q = activeQuestions[currentQuestion];
    const container = document.getElementById('questionContainer');
    const isChecked = !!isAnswerChecked[q.n];

    container.innerHTML = `
        <div class="question-number">Frage ${currentQuestion + 1} von ${activeQuestions.length}${quizMode === 'retry-wrong' ? ' (Wiederholung)' : ''}</div>
        <div class="question-text">${q.t}</div>
        <div class="multi-select-note">ℹ️ Manche Fragen können mehrere richtige Antworten haben. Wähle alle passenden Optionen aus und klicke auf "Überprüfen".</div>
        <div class="options">
            ${q.o.map((opt, i) => {
                const letter = String.fromCharCode(97 + i);
                const isSelected = userAnswers[q.n]?.includes(letter);
                return `<div class="option${isSelected ? ' selected' : ''}${isChecked ? ' locked' : ''}" data-letter="${letter}" onclick="${isChecked ? '' : `selectOption('${letter}')`}">
                    <span class="option-label">${letter.toUpperCase()})</span>${opt}
                </div>`;
            }).join('')}
        </div>
    `;

    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback';
    feedback.textContent = '';

    // If already checked, restore the feedback display
    if (isChecked) {
        const userAns = (userAnswers[q.n] || []).sort();
        const correctAns = (correctAnswers[q.n] || []).sort();
        const isCorrect = JSON.stringify(userAns) === JSON.stringify(correctAns);

        if (isCorrect) {
            feedback.className = 'feedback success show';
            feedback.innerHTML = '✅ <strong>Richtig!</strong> Alle gewählten Antworten sind korrekt.';
        } else {
            feedback.className = 'feedback error show';
            feedback.innerHTML = `❌ <strong>Nicht ganz richtig.</strong> Deine Antwort: ${userAns.join(', ').toUpperCase()}. Richtige Antwort(en): ${correctAns.join(', ').toUpperCase()}`;
        }

        document.querySelectorAll('.option').forEach(el => {
            const letter = el.dataset.letter;
            if (correctAnswers[q.n]?.includes(letter)) el.classList.add('correct');
            if (userAns.includes(letter) && !correctAnswers[q.n]?.includes(letter)) el.classList.add('incorrect');
        });
    }

    updateProgress();
    updateNavigation();
    updateCheckButton();

    const modeText = isChecked
        ? (JSON.stringify((userAnswers[q.n]||[]).sort()) === JSON.stringify((correctAnswers[q.n]||[]).sort()) ? '✅ Richtig!' : '❌ Falsch — siehe korrekte Antwort unten.')
        : '👆 Wähle alle passenden Antworten aus und klicke auf "Überprüfen"!';
    document.getElementById('modeInfo').textContent = quizMode === 'retry-wrong' ? `🔁 Wiederholungsmodus — ${modeText}` : modeText;
}

function selectOption(letter) {
    const qNum = activeQuestions[currentQuestion].n;
    if (isAnswerChecked[qNum]) return;

    if (!userAnswers[qNum]) userAnswers[qNum] = [];
    const idx = userAnswers[qNum].indexOf(letter);
    if (idx > -1) userAnswers[qNum].splice(idx, 1);
    else userAnswers[qNum].push(letter);

    renderQuestion();
}

function checkAnswer() {
    const qNum = activeQuestions[currentQuestion].n;
    if (isAnswerChecked[qNum]) return;

    const userAns = userAnswers[qNum]?.sort() || [];
    if (userAns.length === 0) {
        alert('Bitte wähle mindestens eine Antwort aus!');
        return;
    }

    const correctAns = (correctAnswers[qNum] || []).sort();
    isAnswerChecked[qNum] = true;

    const isCorrect = JSON.stringify(userAns) === JSON.stringify(correctAns);

    if (!isCorrect && !wrongQuestions.includes(qNum)) {
        wrongQuestions.push(qNum);
    }

    renderQuestion();
}

function nextQuestion() {
    const currentQNum = activeQuestions[currentQuestion].n;

    // Only show the skip warning if the question has NOT been answered yet
    if (!isAnswerChecked[currentQNum]) {
        if (!confirm('Diese Frage wurde noch nicht beantwortet. Möchtest du sie wirklich überspringen?')) {
            return;
        }
    }

    if (currentQuestion < activeQuestions.length - 1) {
        currentQuestion++;
        renderQuestion();
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}

function updateProgress() {
    const percent = ((currentQuestion + 1) / activeQuestions.length) * 100;
    document.getElementById('progressFill').style.width = `${percent}%`;
    document.getElementById('questionIndicator').textContent = `Frage ${currentQuestion + 1} von ${activeQuestions.length}`;
}

function updateNavigation() {
    document.getElementById('prevBtn').disabled = currentQuestion === 0;
    document.getElementById('nextBtn').textContent = currentQuestion === activeQuestions.length - 1 ? 'Abschließen' : 'Weiter →';
}

function updateCheckButton() {
    const btn = document.getElementById('checkBtn');
    const qNum = activeQuestions[currentQuestion].n;
    if (isAnswerChecked[qNum]) {
        btn.textContent = '✅ Antwort geprüft';
        btn.disabled = true;
    } else {
        btn.textContent = '✅ Antwort überprüfen';
        btn.disabled = false;
    }
}

function calculateResults() {
    let correctCount = 0;
    wrongQuestions = [];

    Object.keys(userAnswers).forEach(qNumStr => {
        const qNum = parseInt(qNumStr);
        const userAns = (userAnswers[qNum] || []).sort();
        const correctAns = (correctAnswers[qNum] || []).sort();

        if (JSON.stringify(userAns) === JSON.stringify(correctAns)) {
            correctCount++;
        } else {
            if (!wrongQuestions.includes(qNum)) wrongQuestions.push(qNum);
        }
    });

    return { correctCount, total: activeQuestions.length, wrongQuestions };
}

function showResults() {
    const { correctCount, total, wrongQuestions: wrong } = calculateResults();
    const score = Math.round((correctCount / total) * 100);

    hideQuizUI();
    document.getElementById('modeInfo').innerHTML = '🎉 Quiz abgeschlossen!';
    document.getElementById('scoreDisplay').classList.remove('hidden');
    document.getElementById('scoreCircle').textContent = `${score}%`;
    document.getElementById('scoreText').textContent = `Du hast ${correctCount} von ${total} Fragen richtig beantwortet!`;

    const retryBtn = document.getElementById('retryWrongBtn');
    document.getElementById('wrongCount').textContent = wrong.length;
    retryBtn.disabled = wrong.length === 0;
}

function retryWrongQuestions() {
    if (wrongQuestions.length === 0) return;

    // Build a list of only the wrong questions, preserving original order
    activeQuestions = originalQuestions.filter(q => wrongQuestions.includes(q.n));

    currentQuestion = 0;
    userAnswers = {};
    isAnswerChecked = {};
    wrongQuestions = [];
    quizMode = 'retry-wrong';

    document.getElementById('scoreDisplay').classList.add('hidden');
    document.getElementById('modeInfo').textContent = '🔁 Wiederholungsmodus: Nur falsch beantwortete Fragen!';
    showQuizUI();
    renderQuestion();
}

function restartQuiz() {
    activeQuestions = [...originalQuestions];
    currentQuestion = 0;
    userAnswers = {};
    isAnswerChecked = {};
    wrongQuestions = [];
    quizMode = 'normal';

    document.getElementById('scoreDisplay').classList.add('hidden');
    document.getElementById('modeInfo').textContent = '👆 Wähle alle passenden Antworten aus und klicke auf "Überprüfen"!';
    showQuizUI();
    renderQuestion();
}
startQuiz();
</script>
